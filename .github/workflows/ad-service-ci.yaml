
name: ad-service-ci

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Build Ad Service
        working-directory: src/ad
        run: |
          chmod +x gradlew
          ./gradlew installDist -PprotoSourceDir=./pb

  docker:
    runs-on: ubuntu-latest

    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: src/ad
          file: src/ad/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/ad-service:${{ github.run_id }}

  updatek8s:
    runs-on: ubuntu-latest

    needs: docker

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Update tag in Kubernetes deployment manifest
        run: |
          sed -i "s|image: .*|image: ${{ secrets.DOCKERHUB_USERNAME }}/ad-service:${{ github.run_id }}|" kubernetes/ad/deploy.yaml

      - name: Commit and push changes
        run: |
          git config user.email "saijagadeesh14@gmail.com"
          git config user.name "saijagadeesh14"
          git add kubernetes/ad/deploy.yaml
          git commit -m "[CI]: Update Ad service image tag" || echo "No changes to commit"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
