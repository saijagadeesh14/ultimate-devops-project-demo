
name: ad-service-ci 

on:
  pull_request:
    branches:
      - main
    paths:
      - 'src/ad/**'
      - '.github/workflows/ad-service-ci.yaml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Build Ad Service 
        working-directory: src/ad
        run: |
          chmod +x gradlew
          ./gradlew installDist -PprotoSourceDir=./pb
  Docker:
    runs-on: ubuntu-latest

    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Docker
        uses: docker/setup-buildx-action@v1

      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./src/ad
          file: ./src/ad/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/ad-service:${{ github.run_id }}

  
  updatek8s:
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name == 'push'

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.ref_name }}

      - name: Update tag in Kubernetes deployment manifest
        run: |
          sed -i "s|image: .*|image: ${{ secrets.DOCKERHUB_USERNAME }}/ad-service:${{ github.run_id }}|" kubernetes/ad/deploy.yaml

      - name: Commit and push changes
        run: |
          git config user.email "saijagadeesh14@gmail.com"
          git config user.name "saijagadeesh14"
          git add kubernetes/ad/deploy.yaml
          git commit -m "[CI]: Update Ad service image tag" || echo "No changes to commit"
          git push origin HEAD:${{ github.ref_name }}
